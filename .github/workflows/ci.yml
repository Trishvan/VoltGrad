name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build VoltGrad and Tools
        run: go build -v ./...

      - name: Build Shader Compiler CLI
        run: go build -v ./cmd/compileshaders

      - name: Run Test Suite
        run: go test -v -count=1 ./...

  verify-shaders-and-cross-build:
    name: Cross-Platform Build & Shader Verification
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Native glslc (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc

      - name: Verify Shader Compilation with Native glslc
        if: matrix.os == 'ubuntu-latest'
        run: go run ./cmd/compileshaders

      - name: Build VoltGrad and CLI Tools
        run: go build -v ./...

      - name: Run Unit Tests
        run: go test -v -count=1 ./...
