name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  shaders-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Shader Compiler Dependencies
        run: npm install @webgpu/glslang

      - name: Recompile Shaders & Verify Clean Diff
        run: |
          node voltgrad/shaders/compile.js
          git diff --exit-code voltgrad/shaders/*.spv

      - name: Go Build
        run: go build -v ./...

      - name: Run Tests
        run: go test -v -count=1 ./...
